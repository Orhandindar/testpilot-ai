services:
  postgres:
    image: postgres:16
    container_name: testpilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: testpilot
      POSTGRES_USER: testpilot
      POSTGRES_PASSWORD: testpilot_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: